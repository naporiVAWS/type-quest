<style>
:root{--bg:#120d2e;--card:rgba(255,255,255,.11);--inp:#241f52;--fg:#fff;--mut:#e1ddff;--ac:#ffd166;--ac2:#ff6fb5;--on:#2a1a00;--bad:#ff7a8a;--line:rgba(255,255,255,.3);--ty:#5ee6c8;--hd:rgba(18,13,46,.72);--pri:linear-gradient(135deg,#ffd166,#ff9f43);--glow:0 10px 32px rgba(0,0,0,.35)}
body.m-school{--bg:#f3f8ff;--card:#ffffff;--inp:#ffffff;--fg:#16202c;--mut:#445064;--ac:#1d5fa8;--ac2:#2e8bff;--on:#ffffff;--bad:#b3261e;--line:#c3d1e4;--ty:#1d5fa8;--hd:rgba(255,255,255,.92);--pri:linear-gradient(135deg,#2e8bff,#1d5fa8);--glow:0 6px 22px rgba(29,95,168,.16)}
body.m-game{--bg:#050816;--card:rgba(12,20,52,.84);--inp:#0c1434;--fg:#fff;--mut:#c4d0ff;--ac:#00e5ff;--ac2:#ff3d9a;--on:#00141a;--bad:#ff4d6d;--line:rgba(0,229,255,.55);--ty:#7cff6b;--hd:rgba(5,8,22,.88);--pri:linear-gradient(135deg,#00e5ff,#3d7bff);--glow:0 0 24px rgba(0,229,255,.28)}
body[data-th=sakura]:not(.m-school){--ac:#ff8fb8;--ac2:#ffb3d1;--on:#3a0720;--ty:#ffc2dc;--pri:linear-gradient(135deg,#ffb3d1,#ff7aa8)}
body[data-th=ocean]:not(.m-school){--ac:#6ec1ff;--ac2:#8ae6ff;--on:#041a2e;--ty:#9ee7ff;--pri:linear-gradient(135deg,#8ae6ff,#4a8bff)}
body[data-th=forest]:not(.m-school){--ac:#8ce99a;--ac2:#c8f27a;--on:#06240f;--ty:#b9f5c0;--pri:linear-gradient(135deg,#c8f27a,#4fd18b)}
body.m-mobile{--bg:#0b1030;--card:rgba(255,255,255,.1);--inp:#18214f;--fg:#fff;--mut:#d4dcff;--ac:#5cf2c8;--ac2:#ff7ac8;--on:#04231b;--bad:#ff7a8a;--line:rgba(120,255,220,.4);--ty:#ffd166;--hd:rgba(11,16,48,.82);--pri:linear-gradient(135deg,#5cf2c8,#4aa8ff);--glow:0 8px 28px rgba(92,242,200,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;color:var(--fg);font:17px/1.6 "Zen Maru Gothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;
 background:radial-gradient(1100px 600px at 8% -10%,#5b3df5aa,transparent 60%),radial-gradient(900px 600px at 100% 0,#ff4fa355,transparent 55%),radial-gradient(900px 700px at 50% 115%,#2dd4bf40,transparent 60%),var(--bg);background-attachment:fixed}
body.m-game{font-family:"DotGothic16","Zen Maru Gothic","Hiragino Sans","Yu Gothic",monospace;
 background:radial-gradient(900px 500px at 85% -10%,#ff3d9a33,transparent 60%),radial-gradient(900px 600px at 0 110%,#00e5ff33,transparent 60%),linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px),var(--bg);background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed}
body.m-game::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(#0000 0 3px,#0000001f 3px 4px)}
body.m-school{background:linear-gradient(180deg,#dcebff,var(--bg) 340px);background-attachment:fixed}
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) clamp(12px,3vw,40px) 12px;background:var(--hd);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff6fb5,#ffd166,#5ee6c8,#6a4cff,#ff6fb5);background-size:200% 100%;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:200% 0}}
body.m-school header::after{background:linear-gradient(90deg,#2e8bff,#1d5fa8,#2e8bff);animation:none}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer;padding:2px 8px 2px 2px;border-radius:18px;transition:transform .15s}
.logo:hover{transform:translateY(-1px)}
.lg-mark{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--pri);color:var(--on);font-size:26px;box-shadow:0 6px 18px #0006,inset 0 0 0 2px #ffffff55;transform:rotate(-6deg);transition:transform .2s}
.logo:hover .lg-mark{transform:rotate(0) scale(1.08)}
.lg-mark i{position:absolute;right:-7px;bottom:-7px;font-style:normal;font-size:19px;filter:drop-shadow(0 2px 2px #0007)}
.lg-txt{display:flex;flex-direction:column;line-height:1}
.lg-txt b{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-size:27px;letter-spacing:.05em;font-weight:400;background:var(--pri);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #0004)}
.lg-txt b em{font-style:normal;margin-left:.15em;background:linear-gradient(135deg,#fff,#ffd9f0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.m-school .lg-txt b em{background:linear-gradient(135deg,#16202c,#445064);-webkit-background-clip:text;background-clip:text}
.lg-txt small{font-size:11px;letter-spacing:.38em;color:var(--mut);margin-top:6px;font-weight:700}
.m-game .lg-mark{border-radius:6px}.m-game .lg-txt b{filter:drop-shadow(0 0 8px var(--ac))}
#tabs{display:flex;gap:4px;justify-content:center;padding:5px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
body.m-school #tabs{background:#eef2f7}
#tabs button{padding:9px 18px;font-weight:800;border-radius:999px;border:0;background:transparent;box-shadow:none;backdrop-filter:none;white-space:nowrap}
#tabs button:hover{transform:none;box-shadow:none;background:#ffffff1f}
#tabs em{font-style:normal;font-weight:500;opacity:.8;margin-left:1px}
.m-game #tabs button,.m-game #tabs button:hover{box-shadow:none}
#tabs button.on,#tabs button.on:hover{background:var(--pri);color:var(--on);box-shadow:0 4px 16px #0005}
.m-game #tabs button.on,.m-game #tabs button.on:hover{box-shadow:0 0 16px var(--ac)}
.tools{display:flex;gap:8px;align-items:center}.tools input{width:120px;padding:8px 12px}.tools button{padding:8px 12px}
.lvchip{position:relative;padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:14px;overflow:hidden;white-space:nowrap}
.lvchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
main{flex:1;width:100%;display:flex;flex-direction:column;padding:clamp(14px,2.5vw,32px) clamp(12px,3vw,40px) calc(28px + env(safe-area-inset-bottom))}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
h1{font-size:clamp(26px,3.6vw,40px);margin:0;line-height:1.25}h2{font-size:20px;margin:0 0 8px}
p{margin:0}.mut{color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
option{background:var(--inp);color:var(--fg)}
button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;font-weight:700;transition:transform .15s,box-shadow .15s,border-color .15s;backdrop-filter:blur(8px)}
button:hover,button:focus-visible{transform:translateY(-2px);box-shadow:var(--glow);border-color:var(--ac);outline:none}
button:active{transform:translateY(0)}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
button.pri{background:var(--pri);color:var(--on);border-color:transparent;font-weight:900}
input,select,textarea{background:var(--inp);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac)}
::placeholder{color:var(--mut);opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--glow);backdrop-filter:blur(14px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
/* ホーム */
.hero-banner{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:clamp(24px,4vw,46px);border-radius:30px;background:linear-gradient(120deg,#6a4cff,#c44bd8 55%,#ff7a8a);color:#fff;box-shadow:var(--glow);position:relative;overflow:hidden}
.hero-banner::before{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;background:#ffffff1f}
.m-game .hero-banner{background:linear-gradient(120deg,#0b1b4d,#3b0f6b 60%,#ff3d9a);border:2px solid var(--line)}
.m-school .hero-banner{background:linear-gradient(120deg,#2e8bff,#1d5fa8)}
.hb-main{position:relative}.hero-banner h1{font-size:clamp(32px,5.4vw,60px);margin:4px 0 8px;text-shadow:0 2px 14px #0005}
.hb-tag{font-weight:900;letter-spacing:.08em;opacity:.95}
.hb-art{display:flex;gap:8px;font-size:clamp(44px,8vw,100px);position:relative}
.hb-art span{animation:bob 2.4s ease-in-out infinite}.hb-art span:nth-child(2){animation-delay:.4s}.hb-art span:nth-child(3){animation-delay:.8s}
.m-school .hb-art span{animation:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:999px;background:#00000045;font-weight:800;font-size:15px;color:#fff}
.daily{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,#ffd16630,#ff6fb530)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.act{--c:#a78bfa;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:24px;min-height:176px;border-radius:24px;border-top:5px solid var(--c)}
.act[data-a=solo]{--c:#4ade80}.act[data-a=cpu]{--c:#60a5fa}.act[data-a=dun]{--c:#f472b6}.act[data-a=room]{--c:#fbbf24}.act[data-a=join]{--c:#a78bfa}
.act i{display:grid;place-items:center;width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,var(--c),#ffffff66);font-size:34px;font-style:normal;box-shadow:0 8px 18px #0004}
.act b{font-size:22px}.act span{color:var(--mut);font-weight:500;font-size:15px}
.m-school .act i{display:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{padding:12px;border-radius:16px;border:1px solid var(--line);opacity:.5;display:flex;flex-direction:column;gap:2px}
.bd.on{opacity:1;background:linear-gradient(135deg,#ffd16638,#ff9f4338);border-color:var(--ac)}
.bd i{font-style:normal;font-size:26px}.bd b{font-size:14px}.bd span{font-size:12px;color:var(--mut)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:800}
kbd{display:inline-block;min-width:1.6em;text-align:center;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--inp);font:700 14px ui-monospace,Menlo,monospace}
/* ゲーム画面 */
#hud{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:clamp(16px,2vw,22px);font-weight:800;padding:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
#play{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-content:start}
#play.side{grid-template-columns:minmax(0,1fr) minmax(260px,380px)}
@media(max-width:900px){#play.side{grid-template-columns:minmax(0,1fr)}}
#main{position:relative}
#kana{font-size:clamp(34px,7vw,88px);text-align:center;font-weight:900;margin:6px 0 2px;word-break:break-all;line-height:1.25;text-shadow:0 3px 18px #0006}
#kana.long{font-size:clamp(22px,4.4vw,52px)}
#roma{font:800 clamp(22px,4.2vw,54px)/1.4 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:.06em;word-break:break-all}
#roma b{color:var(--ty)}
#roma u{text-decoration:none;background:var(--pri);color:var(--on);border-radius:6px;padding:0 4px;box-shadow:0 0 16px var(--ac)}
#combo{text-align:center;min-height:1.4em;font-weight:900;font-size:clamp(20px,3.4vw,38px);color:var(--ac);text-shadow:0 0 14px var(--ac2)}
#combo.pulse{animation:pulse .3s}
#kb{margin:10px 0;user-select:none}
#kb div{display:flex;justify-content:center;gap:6px;margin:6px 0}
#kb kbd{display:inline-grid;place-items:center;min-width:clamp(26px,6vw,64px);height:clamp(32px,6.5vw,60px);font-size:clamp(14px,2vw,22px);padding:0;border-radius:10px;box-shadow:0 3px 0 #0005}
#kb kbd.on{background:var(--pri);color:var(--on);border-color:transparent;transform:translateY(3px);box-shadow:0 0 18px var(--ac)}
.r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r em{font-style:normal;color:var(--mut);font-size:13px}
.bar{height:16px;border-radius:8px;background:#0006;border:1px solid var(--line);overflow:hidden}
.m-school .bar{background:#e4ebf3}
.r .bar{height:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ty),var(--ac));transition:width .2s}
#ebar i{background:linear-gradient(90deg,#ff4d6d,#ff9f43)}#tbar i{background:var(--ac);transition:none}#tbar.low i{background:var(--bad)}
.sp{display:inline-block;width:clamp(100px,14vw,200px);vertical-align:middle}.sp i{background:linear-gradient(90deg,var(--ac2),var(--ac))}
/* ダンジョン */
#stage{position:relative;text-align:center}
.arena{position:relative;display:flex;align-items:flex-end;justify-content:space-around;min-height:clamp(170px,26vw,300px);padding:16px;border-radius:24px;overflow:hidden;border:1px solid var(--line);
 background:radial-gradient(500px 220px at 50% 100%,#ffffff2a,transparent 70%),linear-gradient(180deg,var(--b1,#1b1450),var(--b2,#3a1f6e) 60%,var(--b3,#2a1650))}
.m-game .arena{border:2px solid var(--line);border-radius:6px;box-shadow:0 0 28px #00e5ff44 inset;background:radial-gradient(500px 220px at 50% 100%,#00e5ff38,transparent 70%),linear-gradient(180deg,#0a1030,#1a0a3d 60%,#12072e)}
.m-game .arena{background:radial-gradient(500px 220px at 50% 100%,#00e5ff38,transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--b1,#0a1030) 60%,#000),color-mix(in srgb,var(--b2,#1a0a3d) 60%,#000) 60%,color-mix(in srgb,var(--b3,#12072e) 60%,#000))}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,#0009);pointer-events:none}
.floorTag{position:absolute;left:16px;top:10px;font-weight:900;font-size:clamp(20px,3vw,32px);color:var(--ac);text-shadow:0 0 12px var(--ac)}
.hero{font-size:clamp(56px,10vw,110px);line-height:1.1;z-index:1}
.hero.atk{animation:lunge .3s}
.mon{z-index:1;font-size:clamp(70px,13vw,150px);line-height:1.1;scale:var(--s,1);transform-origin:50% 100%}
.mon.an-hop{animation:hop 1.1s ease-in-out infinite}
.mon.an-fly{animation:fly 2s ease-in-out infinite}
.mon.an-sway{animation:sway 1.4s ease-in-out infinite}
.mon.an-float{animation:floaty 2.6s ease-in-out infinite}
.mon.an-stomp{animation:stomp 1.8s ease-in-out infinite}
.mon.an-crawl{animation:crawl 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.08,.92)}40%{transform:translateY(-22px) scale(.94,1.08)}70%{transform:translateY(0) scale(1.1,.9)}}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(-18px,-26px) rotate(-6deg)}50%{transform:translate(8px,-8px)}75%{transform:translate(20px,-30px) rotate(6deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes stomp{0%,100%{transform:translateY(0) scale(1)}8%{transform:translateY(-14px)}16%{transform:translateY(0) scale(1.06,.94)}}
@keyframes crawl{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.mon.a-lunge{animation:alunge .55s ease-in}
.mon.a-dive{animation:adive .6s ease-in}
.mon.a-slam{animation:aslam .7s ease-in}
.mon.a-puff{animation:apuff .6s ease-out}
.mon.a-shoot{animation:ashoot .5s ease-out}
@keyframes alunge{45%{transform:translateX(calc(-1*clamp(80px,26vw,380px))) rotate(-10deg)}}
@keyframes adive{35%{transform:translateY(-40px)}60%{transform:translate(calc(-1*clamp(80px,24vw,340px)),20px) rotate(-20deg)}}
@keyframes aslam{30%{transform:translateY(-60px) scale(1.1)}55%{transform:translateY(0) scale(1.15,.85)}}
@keyframes apuff{50%{transform:scale(1.35,.8)}}
@keyframes ashoot{30%{transform:translateX(18px) scale(.95)}60%{transform:translateX(-14px) scale(1.08)}}
.mon.enter{animation:enter .6s ease-out}
@keyframes enter{from{transform:translateX(60vw);opacity:0}}
.mon.hidden{visibility:hidden}
.mon.dead{animation:dead .65s forwards}
@keyframes dead{to{transform:translateY(40px) rotate(180deg) scale(.2);opacity:0}}
.mon.warn{filter:drop-shadow(0 0 10px var(--bad)) brightness(1.2)}
.mon.rage{filter:drop-shadow(0 0 16px #ff2d55) saturate(1.8)}
.mon.fade{opacity:.35}
.hero.dead{animation:herodead .7s forwards}
@keyframes herodead{to{transform:rotate(90deg) translateY(30px);opacity:.3}}
.arena.quake{animation:sh .35s}
.proj{position:absolute;font-style:normal;font-size:clamp(28px,6vw,56px);z-index:3;pointer-events:none;transform:translate(-50%,-50%);animation:proj .45s ease-in forwards}
@keyframes proj{to{transform:translate(calc(-50% + var(--dx,-200px)),-50%) rotate(-360deg)}}
.deco{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:space-around;font-size:clamp(24px,5vw,56px);opacity:.5;pointer-events:none;white-space:nowrap}
.gr{position:absolute;left:0;right:0;bottom:0;height:14%;background:repeating-linear-gradient(90deg,#ffffff14 0 18px,transparent 18px 40px);pointer-events:none}
.arena.walk .gr{animation:gr .5s linear infinite}
.arena.walk .hero{animation:herorun .3s ease-in-out infinite}
@keyframes gr{to{background-position:-40px 0}}
@keyframes herorun{50%{transform:translateY(-10px) rotate(4deg)}}
.mon.enter.hit{animation:enter .6s ease-out}
.pop.heal{color:#7cff6b}
#mname small{font-size:.62em;font-weight:600;color:var(--mut);margin-left:8px}
.stages{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stg{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--b1),var(--b2));color:#fff;border:2px solid transparent}
.stg.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac) inset,var(--glow)}
.stg i{font-size:34px;font-style:normal;line-height:1.1}.stg b{font-size:17px}.stg span{font-size:13px;opacity:.92;font-weight:500}
.stg .stars{color:#ffd166;letter-spacing:2px;font-weight:800}
.stg:disabled{filter:grayscale(.8) brightness(.55)}
body.fk .deco{display:none}
.mon.boss{filter:drop-shadow(0 0 18px var(--bad))}
.mon.hit{animation:hit .25s}
#mname{font-size:clamp(18px,2.4vw,26px);font-weight:900;margin:10px 0 8px}

const K={};KA.split("").forEach((k,i)=>K[k]=RO[i].split("|"));
K["、"]=[","];K["。"]=["."];K["！"]=["!"];K["？"]=["?"];
const CB={き:["ky"],し:["sy","sh"],ち:["ty","ch","cy"],に:["ny"],ひ:["hy"],み:["my"],り:["ry"],ぎ:["gy"],じ:["zy","j","jy"],び:["by"],ぴ:["py"]};
const SM={ゃ:"a",ゅ:"u",ょ:"o"};
const OK=new RegExp("^(["+KA+"っんーゃゅょ、。！？]+|[a-z]+)$");
function tok(s){
  const T=[];let tsu=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i];let c;
    if(ch==="っ"){tsu=true;continue}
    if(ch==="ん")c=null;
    else if(ch==="ー")c=["-"];
    else if(CB[ch]&&SM[s[i+1]]){c=CB[ch].map(x=>x+SM[s[i+1]]);i++}
    else if(K[ch])c=K[ch];
    else c=[ch];
    if(tsu&&c){c=c.map(x=>x[0]+x).concat(c.map(x=>"xtu"+x));tsu=false}
    T.push({c});
  }
  T.forEach((t,i)=>{if(!t.c){const n=T[i+1],f=n&&n.c?n.c[0][0]:"a";t.c="aiueonyx".includes(f)?["nn","xn"]:["n","nn","xn"]}});
  return T;
}
const mk=w=>({T:tok(w),i:0,t:"",d:""});
function press(s,ch){
  const cur=s.T[s.i],t=s.t+ch;
  if(cur.c.some(x=>x.startsWith(t))){
    s.t=t;
    if(cur.c.includes(t)&&!cur.c.some(x=>x.length>t.length&&x.startsWith(t))){s.d+=t;s.t="";s.i++}
    return s.i>=s.T.length?2:1;
  }
  if(s.t&&cur.c.includes(s.t)){
    const n=s.T[s.i+1];
    if(n&&n.c.some(x=>x.startsWith(ch))){s.d+=s.t;s.t="";s.i++;return press(s,ch)}
  }
  return 0;
}

/* ---- オンライン(Firebase Realtime Database) ---- */
const N={host:false,pl:{},id:"p"+Math.random().toString(36).slice(2,10),code:"",school:false,round:null,ref:null};
const myName=()=>($("#nm").value.trim()||"ななし").slice(0,10);
const mkCode=()=>{const a="abcdefghjkmnpqrstuvwxyz23456789";return Array.from({length:5},()=>a[Math.random()*a.length|0]).join("")};
let DB=null,wasOff=false,joinTimer=null;
const FBERR=e=>{
  const code=e&&e.code||"";
  if(code==="PERMISSION_DENIED")return "Firebaseのアクセスが拒否されました。Realtime Databaseのルールを確認してください。";
  if(code==="NETWORK_ERROR")return "ネットワークに接続できません。通信環境を確認してください。";
  return "通信エラー: "+((e&&e.message)||e);
};
function initFb(){
  if(DB)return DB;
  if(typeof firebase==="undefined"){toast("Firebaseを読み込めません。ネットワークや公開環境を確認してください。",8000);return null}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    DB=firebase.database();
    DB.ref(".info/connected").on("value",sn=>{
      if(!N.code)return;
      if(sn.val()===false){wasOff=true;toast("接続が切れました。再接続を待っています…",5000)}
      else if(wasOff){
        wasOff=false;toast("再接続しました");
        if(!(N.host&&N.school)){
          const me=DB.ref("rooms/"+N.code+"/players/"+N.id);
          me.update({name:myName()}).catch(e=>toast(FBERR(e),7000));
          me.onDisconnect().remove().catch(e=>toast(FBERR(e),7000));
        }
      }
    });
    return DB;
  }catch(e){toast("Firebaseの初期化に失敗しました: "+e.message,8000);return null}
}
function leave(){
  stopGame();
  if(joinTimer){clearTimeout(joinTimer);joinTimer=null}
  const code=N.code,host=N.host,ref=N.ref;
  if(ref)ref.off();
  N.ref=null;
  Object.assign(N,{host:false,pl:{},code:"",round:null,school:false});
  if(DB&&code){
    const path=host?"rooms/"+code:"rooms/"+code+"/players/"+N.id;
    DB.ref(path).remove().catch(()=>{});
  }
}
function watch(){
  if(!DB||!N.code)return;
  if(N.ref)N.ref.off();
  const code=N.code,ref=DB.ref("rooms/"+code);
  N.ref=ref;
  ref.on("value",sn=>{
    if(N.code!==code)return;
    const v=sn.val();
    if(!v){toast("部屋が閉じられました");leave();home();return}
    const m=v.meta||{};
    N.pl=v.players||{};N.school=!!m.school;
    if(!N.host&&MD!=="mobile"){
      if(N.school&&MD!=="school")setMode("school",true);
      else if(!N.school&&MD==="school")setMode("normal",true);
    }
    renderAllBoards();
    // 途中参加者も、現在進行中のラウンドに参加できるようにする
    if(!N.host&&m.state==="play"&&Number(m.round||0)!==N.round){
      N.round=Number(m.round||0);
      startNet(Array.isArray(m.words)?m.words:[]);
    }
  },e=>toast(FBERR(e),8000));
}
function hostRoom(){
  if(!initFb())return;
  if(N.code)leave();
  N.host=true;N.school=MD==="school";
  const create=async()=>{
    try{
      let code="",r=null;
      for(let i=0;i<12;i++){
        const candidate=mkCode(),candidateRef=DB.ref("rooms/"+candidate);
        const exists=await candidateRef.once("value");
        if(!exists.exists()){code=candidate;r=candidateRef;break}
      }
      if(!r)throw new Error("部屋コードを作成できませんでした。もう一度お試しください。");
      const init={meta:{school:N.school,host:N.id,state:"lobby",round:0,created:firebase.database.ServerValue.TIMESTAMP}};
      if(!N.school)init.players={[N.id]:{name:myName(),prog:0}};
      await r.set(init);
      N.code=code;N.round=0;
      if(!N.school)await r.child("players/"+N.id).onDisconnect().remove();
      watch();lobby();
    }catch(e){N.host=false;N.code="";toast(FBERR(e),8000)}
  };
  create();
}
function joinRoom(code){
  if(!initFb())return;
  code=String(code||"").trim().toLowerCase().replace(/^tq-/,"");
  if(!/^[a-z2-9]{5}$/.test(code))return toast("部屋コードは5文字で入力してください。",6000);
  if(N.code)leave();
  if(joinTimer)clearTimeout(joinTimer);
  N.host=false;toast("接続中…",5000);
  let settled=false;
  joinTimer=setTimeout(()=>{
    if(!settled){settled=true;toast("接続がタイムアウトしました。Firebaseの設定・通信環境を確認してください。",8000)}
  },12000);
  const r=DB.ref("rooms/"+code);
  r.once("value").then(async sn=>{
    if(settled)return;
    const room=sn.val(),m=room&&room.meta;
    if(!m)throw new Error("部屋が見つかりません。コードを確認してください。");
    const created=Number(m.created||0);
    if(created&&Date.now()-created>43200000)throw new Error("この部屋は期限切れです。ホストに新しい部屋を作ってもらってください。");
    const me=r.child("players/"+N.id);
    await me.set({name:myName(),prog:0});
    await me.onDisconnect().remove();
    settled=true;clearTimeout(joinTimer);joinTimer=null;
    N.code=code;
    // play中の部屋にリンクから入った場合も、現在の問題を開始する
    N.round=m.state==="play"?Number(m.round||0)-1:Number(m.round||0);
    watch();lobby();
  }).catch(e=>{
    if(settled)return;
    settled=true;clearTimeout(joinTimer);joinTimer=null;
    N.code="";N.host=false;
    toast(FBERR(e),8000);
  });
}
function netTest(){
  if(!initFb())return;
  toast("通信テスト中…",9000);
  const t=setTimeout(()=>toast("Firebaseに接続できません。ネットワーク(学校のフィルタなど)を確認してください。",9000),8000);
  let fired=false;
  DB.ref(".info/connected").on("value",sn=>{
    if(!sn.val()||fired)return;fired=true;clearTimeout(t);
    const r=DB.ref("rooms/_test/"+N.id);
    r.set({t:firebase.database.ServerValue.TIMESTAMP}).then(()=>r.once("value"))
      .then(x=>x.exists()?r.remove().then(()=>toast("通信テスト成功: この端末で対戦できます",6000)):toast("書き込みはできましたが、読み取れませんでした",8000))
      .catch(e=>toast(FBERR(e),9000));
  });
}

function progress(acc,cpm,win){
  const t=TODAY(),st=jget("tq_st",{games:0,keys:0,maxCombo:0,bestFloor:0,streak:0,daily:0,xp:0,last:""}),ach=jget("tq_ach",{});
  const b=lvInfo(st.xp).l;
  if(st.last!==t){st.streak=st.last===dayStr(new Date(Date.now()-864e5))?st.streak+1:1;st.last=t}
  st.games++;st.keys+=G.keys;st.maxCombo=Math.max(st.maxCombo,G.maxc);
  if(G.mode==="dun")st.bestFloor=Math.max(st.bestFloor,G.floor);
  if(G.mode==="daily")st.daily++;
  const gain=Math.round(G.keys*.5+(acc>=.95?15:0)+(G.mode==="dun"?(G.st?G.floor*5:G.floor*8)+G.kills*4+(G.cleared?50+(G.stars||1)*20:0):0)+(G.mode==="daily"?40:0)+(win?15:0));
  const dv=Object.values(dgnData().st);st.cleared=dv.filter(x=>x.stars>0).length;st.stars3=dv.filter(x=>x.stars>=3).length;
  st.xp+=gain;
  const l=lvInfo(st.xp).l,got=ACH.filter(a=>!ach[a.id]&&a.f(st,{acc,cpm,keys:G.keys}));
  got.forEach(a=>ach[a.id]=t);
  ls.set("tq_st",JSON.stringify(st));ls.set("tq_ach",JSON.stringify(ach));
  if(l>b)toast(`レベルアップ! Lv.${l} ${title(l)}`);else if(got.length)toast("実績解除: "+got.map(a=>a.t).join("、"));
  return{gain,l,up:l>b,got,streak:st.streak};
}

function seedRng(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---- フリック入力(スマホモード) ---- */
const SMALL={ゃ:"や",ゅ:"ゆ",ょ:"よ",っ:"つ",ぁ:"あ",ぃ:"い",ぅ:"う",ぇ:"え",ぉ:"お",ゎ:"わ"};
const strip=c=>{const b=c.normalize("NFD")[0];return SMALL[b]||b};
const flNorm=t=>t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).toLowerCase();
let flBase=0,flComp=false;
/* 入力された文字を目標の語と順に照合する。まちがえた文字は数えて無視するので、消さなくても先へ進める */
function flEval(rest,t){
  let j=0,miss=0;const marks=[],exp=[];
  for(let k=0;k<rest.length;k++){
    const c=rest[k];
    if(j<t.length&&c===t[j]){marks.push("ok");j++;if(j>=t.length)return{j,miss,marks,exp,used:k+1}}
    else if(k===rest.length-1&&j<t.length&&strip(c)===strip(t[j]))marks.push("pd");
    else{marks.push("ng");miss++;exp.push(t[j])}
  }
  return{j,miss,marks,exp,used:rest.length};
}
function flDraw(rest,marks){
  const d=$("#fldisp");
  if(!rest){d.classList.add("ph");d.textContent="ここに入力";return}
  d.classList.remove("ph");
  d.innerHTML=[...rest].map((c,i)=>`<span class="${marks[i]||"pd"}">${esc(c)}</span>`).join("");
}
function onFlick(){
  const el=$("#flin");
  if(!G||!G.flick||G.over)return;
  if(G.cd||G.pause){if(G.cd){el.value="";flBase=0;flDraw("",[])}return}
  for(let guard=0;guard<20&&!G.over&&!G.pause;guard++){
    const v=el.value;if(flBase>v.length)flBase=v.length;
    const rest=flNorm(v.slice(flBase)),t=G.words[G.wi],r=flEval(rest,t);
    const gain=r.j-(G.kmax||0);
    if(gain>0){
      for(let k=0;k<gain;k++){G.keys++;G.combo++;G.score+=10+Math.min(G.combo,30);if(G.combo>G.maxc)G.maxc=G.combo;if(G.combo>=5&&G.combo%5===0)pulse()}
      G.kmax=r.j;sfx(1);
    }
    G.kn=r.j;
    const nm=r.miss-(G.fm||0);
    if(nm>0){G.miss+=nm;G.combo=0;r.exp.slice(G.fm||0).forEach(x=>{if(x)G.mk[x]=(G.mk[x]||0)+1});bump();sfx(0)}
    G.fm=Math.max(G.fm||0,r.miss);
    if(r.j>=t.length){
      flBase+=r.used;G.kn=0;G.kmax=0;G.fm=0;sfx(2);wordDone();
      if(G.over||G.pause)break;
      if(flBase>=el.value.length)break;
      continue;
    }
    break;
  }
  if(G.over)return;
  if(!G.pause){
    render();
    const rest=flNorm(el.value.slice(Math.min(flBase,el.value.length)));
    flDraw(rest,flEval(rest,G.words[G.wi]).marks);
  }
  if(!flComp&&el.value.length>40&&flBase>=el.value.length){el.value="";flBase=0}
}
